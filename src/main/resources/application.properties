spring.application.name=payflow-api

# Machine-specific settings (e.g. DB_PASSWORD) live in an untracked local.properties file.
# Copy local.properties.example to local.properties, or set the same names as environment variables.
spring.config.import=optional:file:./local.properties

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by Flyway migrations in db/migration; Hibernate only checks the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Updates are flushed in primary-key order, so two opposite transfers (A->B, B->A)
# lock rows in the same order and cannot deadlock each other
spring.jpa.properties.hibernate.order_updates=true

# JWT signing key (HMAC-SHA256, at least 32 characters) and token lifetime. The key comes from JWT_SECRET
# in local.properties or the environment; the app refuses to start without one.
payflow.jwt.secret=${JWT_SECRET:}
payflow.jwt.expiration=PT1H
# Users come from the database via JWT, so Spring Boot's default in-memory user is not needed
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# How many times a transfer is retried after a concurrent update conflict
payflow.transfer.max-attempts=3

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
# Document JSON responses as application/json instead of */*
springdoc.default-produces-media-type=application/json
