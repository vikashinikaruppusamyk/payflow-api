spring.application.name=payflow-api

# Machine-specific settings (e.g. DB_PASSWORD) live in an untracked local.properties file.
# Copy local.properties.example to local.properties, or set the same names as environment variables.
spring.config.import=optional:file:./local.properties

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Updates are flushed in primary-key order, so two opposite transfers (A->B, B->A)
# lock rows in the same order and cannot deadlock each other
spring.jpa.properties.hibernate.order_updates=true

# How many times a transfer is retried after a concurrent update conflict
payflow.transfer.max-attempts=3

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
