spring.datasource.url=jdbc:h2:mem:payflow
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.show-sql=true

# Updates are flushed in primary-key order, so two opposite transfers (A->B, B->A)
# lock rows in the same order and cannot deadlock each other
spring.jpa.properties.hibernate.order_updates=true

# How many times a transfer is retried after a concurrent update conflict
payflow.transfer.max-attempts=3

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
