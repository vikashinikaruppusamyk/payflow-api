# Tests run against an in-memory H2 database in PostgreSQL compatibility mode, so they need no local setup
spring.datasource.url=jdbc:h2:mem:payflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

payflow.transfer.max-attempts=5
