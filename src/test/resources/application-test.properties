# By default tests run against an in-memory H2 database in PostgreSQL compatibility mode, so they need no
# local setup. Set TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD to run the same suite on real PostgreSQL.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:payflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop

payflow.transfer.max-attempts=5
