name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  test:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [ h2, postgres ]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: payflow_test
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Point tests at PostgreSQL
        if: matrix.database == 'postgres'
        run: |
          echo "TEST_DB_URL=jdbc:postgresql://localhost:5432/payflow_test" >> "$GITHUB_ENV"
          echo "TEST_DB_USERNAME=payflow" >> "$GITHUB_ENV"
          echo "TEST_DB_PASSWORD=payflow" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always() && matrix.database == 'h2'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
